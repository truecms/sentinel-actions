# Sentinel upgrade scan for GitLab CI (truecms/sentinel-actions).
#
# Include this file at a release tag and override the job with your own site
# image, database service and SENTINEL_* variables. See the README.
#
# The job downloads scan.sh from the same release and checks its SHA-256
# before running it. scripts/pin-release.sh writes both values below.

sentinel-upgrade-scan:
  variables:
    SENTINEL_ACTIONS_REF: v1.0.0
    SENTINEL_SCRIPT_SHA256: 741b7f2c90254d8e72168546efa513496c158dbc74d68cb35628b75d8a0dc51c
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      curl -fsSL --proto '=https' -o /tmp/sentinel-upgrade-scan.sh \
        "https://raw.githubusercontent.com/truecms/sentinel-actions/${SENTINEL_ACTIONS_REF}/upgrade-scan/scan.sh"
      echo "${SENTINEL_SCRIPT_SHA256}  /tmp/sentinel-upgrade-scan.sh" | sha256sum -c -
      bash /tmp/sentinel-upgrade-scan.sh
