name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q bats shellcheck php-cli
      - name: Shellcheck
        run: shellcheck scripts/*.sh */scan.sh tests/*/stubs/* examples/drupal-db-image/*.sh
      - name: Tests
        run: bats tests/*/*.bats
      - name: Test WireGuard SSH action
        run: node --test tests/wireguard-ssh.test.js

  # The action's on or off switch, as a workflow passes it from a variable.
  action-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Off through the input
        uses: ./upgrade-scan
        with:
          enabled: 'false'
          site-uuid: not-checked-while-off
          scan-key: not-checked-while-off
      - name: Empty input and no job variable
        uses: ./upgrade-scan
        with:
          enabled: ''
          site-uuid: not-checked-while-off
          scan-key: not-checked-while-off
      - name: Empty input falls back to the job variable
        id: fallback
        continue-on-error: true
        uses: ./upgrade-scan
        env:
          SENTINEL_UPGRADE_SCAN: 'true'
        with:
          site-uuid: not-a-uuid
          scan-key: not-a-key
      - name: The job variable turned the scan on
        run: test "${{ steps.fallback.outcome }}" = failure

  # The secret scan's tests run the real Gitleaks, installed as the action
  # installs it (pinned version, checked SHA-256).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          path="$(python3 -c 'import sys; sys.path.insert(0, "secret-scan"); import scan; print(scan.install_gitleaks())')"
          echo "SENTINEL_TEST_GITLEAKS=$path" >> "$GITHUB_ENV"
      - name: Tests
        run: python3 -m unittest discover -s tests/secret-scan -v

  # The action itself, on a throwaway repository with a planted secret.
  secret-scan-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A repository with a planted secret
        run: |
          repo="$RUNNER_TEMP/fixture"
          mkdir -p "$repo" && cd "$repo"
          git init -q && git config user.email ci@example.com && git config user.name CI
          echo base > README.md && git add -A && git commit -qm base
          # Split so this workflow file holds no whole token.
          printf '$stripe = "%s%s";\n' 'sk_' 'live_51HxQPLANTEDvalue00424242abcd' > settings.php
          git add -A && git commit -qm leak
      - name: Standalone run fails on it
        id: standalone
        continue-on-error: true
        uses: ./secret-scan
        with:
          working-directory: ${{ runner.temp }}/fixture
      - name: It failed
        run: test "${{ steps.standalone.outcome }}" = failure
      - name: Only the summary when told not to fail
        uses: ./secret-scan
        with:
          working-directory: ${{ runner.temp }}/fixture
          fail-on-findings: 'false'
