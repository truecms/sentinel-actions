name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q bats shellcheck php-cli
      - name: Shellcheck
        run: shellcheck scripts/*.sh */scan.sh tests/*/stubs/*
      - name: Tests
        run: bats tests/*/*.bats
