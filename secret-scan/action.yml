name: Sentinel secret scan
description: Find secrets and committed database dumps in each pull request and push, alone or reporting to Sentinel.
author: TrueCMS
branding:
  icon: shield
  color: blue

inputs:
  site-uuid:
    description: >-
      The site's UUID in Sentinel, from the site page. Leave it out to run on
      your own: the check still runs, nothing is sent. With it, the workflow
      needs permissions id-token: write, and the site must accept reports
      from GitHub Actions.
    required: false
    default: ''
  api-url:
    description: Sentinel API base URL. Leave empty for production.
    required: false
    default: ''
  audience:
    description: The audience of the GitHub token sent to Sentinel. Leave empty unless Sentinel tells you otherwise.
    required: false
    default: ''
  working-directory:
    description: The repository root, if it is not the workspace.
    required: false
    default: '.'
  history-commits:
    description: Commits read when the run is not for a pull request or a push with a known range.
    required: false
    default: '50'
  fail-on-findings:
    description: Fail the step when something real is found. Set false to only write the summary.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Scan for secrets and database dumps
      shell: bash
      env:
        SENTINEL_SITE_UUID: ${{ inputs.site-uuid }}
        SENTINEL_API_URL: ${{ inputs.api-url }}
        SENTINEL_AUDIENCE: ${{ inputs.audience }}
        SENTINEL_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SENTINEL_HISTORY_COMMITS: ${{ inputs.history-commits }}
        SENTINEL_FAIL: ${{ inputs.fail-on-findings }}
      run: python3 "$GITHUB_ACTION_PATH/scan.py"
